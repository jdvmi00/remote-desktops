name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Repository validation
        run: python scripts/check.py
      - name: Rust format, lint, and tests
        run: |
          rustup show
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          cargo build --locked
      - name: Qt manager dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake qt6-base-dev qt6-declarative-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript libqt6svg6 lua5.4
      - name: Qt manager build and isolated tests
        run: |
          cmake -S ui -B build/ui -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui --parallel 2
          ctest --test-dir build/ui --output-on-failure
          lua5.4 tests/local_command.lua
      - name: Host recovery and repository tests
        run: python -m unittest discover -s tests -v
      - name: Standalone daemon integration
        run: python tests/integration.py -v

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Repository validation on Windows
        run: python scripts/check.py
      - name: Repository checker regression tests on Windows
        run: python -m unittest discover -s tests -p test_repository.py -v
      - name: Windows host transport and recovery tests
        run: python -m unittest discover -s tests -p test_windows_display.py -v

  windows-display-policy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PowerShell display policy and atomic journal
        shell: powershell
        run: .\remote_desktops\windows\Test.ps1 -PolicyOnly
